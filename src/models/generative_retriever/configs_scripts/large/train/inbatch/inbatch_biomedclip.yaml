# Stage 2 — Generator (T5-small) training with BiomedCLIP + retrained RQ
# Set quantizer_path to the Stage 1 checkpoint before running.
# feature_dim: 512 drives embed_projector and codebook init in retriever.py

codebook_config:
  codebook_level: 8
  codebook_vocab: 4096
  feature_dim: 512                # must match Stage 1 config
  pool_path: extracted_embed/BiomedCLIP/train/cand_pool_mimic_cxr_IT_dict.pt
  quantizer_path: checkpoint/rq_biomedclip/Large/Instruct/InBatch/best.pth   # set after Stage 1
  query_path: extracted_embed/BiomedCLIP/train/train_mimic_cxr_IT_dict.pt

data_config:
  enable_query_instruct: true
  hard_neg_num: 0
  image_size: 224, 224
  in_batch_neg_num: 0
  query_instruct_path: instructions/query_instructions.tsv
  returns: null
  shuffle_cand: true
  train_cand_pool_path: cand_pool/local/mbeir_mimic_cxr_cand_pool.jsonl
  train_query_data_path: query/train/mbeir_mimic_cxr_train.jsonl
  val_cand_pool_path: cand_pool/local/mbeir_mimic_cxr_cand_pool.jsonl
  val_query_data_path: query/val/mbeir_mimic_cxr_val.jsonl

dataloader_config:
  num_workers: 8
  train_batch_size: 256
  valid_batch_size: 128

dist_config:
  dist_url: env://

evaluator:
  enable_eval: true
  eval_freq: 5
  eval_start: 20
  print_freq: 10

experiment:
  description: ${model.name} ${model.size} ${experiment.instruct_status} ${experiment.exp_name}
  exp_name: InBatch
  instruct_status: Instruct
  path_suffix: ${model.short_name}/${model.size}/${experiment.instruct_status}/${experiment.exp_name}/

hyperparameter_config:
  alpha: 2

logger_config:
  logger_out_dir: logger/${experiment.path_suffix}
  logger_out_file_name: train.log

model:
  ckpt_config:
    ckpt_dir: checkpoint/${experiment.path_suffix}
    ckpt_name: ''
    resume_training: false
  gather_embeddings: true
  name: GENIUS_biomedclip_t5small
  short_name: GENIUS_biomedclip
  size: Large
  trie_type: trie_cpp

seed: 2023

trainer_config:
  eval_steps: 500
  gradient_accumulation_steps: 1
  learning_rate: 1e-4
  num_train_epochs: 31
  print_freq: 51
  warmup_steps: 0

wandb_config:
  enabled: false
  experiment_name: ${experiment.description}
  wandb_key: wandb_key
  wandb_project: GENIR
